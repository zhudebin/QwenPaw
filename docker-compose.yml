version: '3.8'

volumes:
  qwenpaw-data:
    name: qwenpaw-data
  qwenpaw-secrets:
    name: qwenpaw-secrets
  qwenpaw-backups:
    name: qwenpaw-backups

services:
  qwenpaw:
    image: agentscope/qwenpaw:latest
    container_name: qwenpaw
    restart: always
    ports:
      - "8088:8088"
    environment:
     - QWENPAW_AUTH_ENABLED=true
     - QWENPAW_AUTH_USERNAME=admin
     - QWENPAW_AUTH_PASSWORD=admin
     - TZ=Asia/Shanghai
    volumes:
      - qwenpaw-data:/app/working:z
      - qwenpaw-secrets:/app/working.secret:z
      - qwenpaw-backups:/app/working.backups:z
      - /etc/localtime:/etc/localtime:ro